name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token. Pull requests from forks never get write access or secrets.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # .npmrc sets ignore-scripts=true, so no dependency install scripts run.
      - run: npm ci
      - run: npm audit signatures
      - run: npm run build
      - run: npm run test:note
      - name: Versions agree
        run: |
          node -e '
            const m = require("./manifest.json"), p = require("./package.json"), v = require("./versions.json");
            if (m.version !== p.version) throw new Error(`manifest ${m.version} != package ${p.version}`);
            if (v[m.version] !== m.minAppVersion) throw new Error(`versions.json lacks ${m.version}: ${m.minAppVersion}`);
          '
