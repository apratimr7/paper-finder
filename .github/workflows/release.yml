name: Release

# Runs when a maintainer pushes a version tag such as 0.1.0 (no "v": Obsidian requires the
# tag to equal the version in manifest.json).
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write      # create the release
  id-token: write      # sign the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit signatures
      - run: npm run build
      - name: Tag matches manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const m = require("./manifest.json");
            if (m.version !== process.env.TAG) throw new Error(`tag ${process.env.TAG} != manifest ${m.version}`);
          '
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" main.js manifest.json styles.css \
            --title "$TAG" --generate-notes --verify-tag
